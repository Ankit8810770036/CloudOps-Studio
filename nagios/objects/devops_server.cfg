###############################################################################
# HOST AND SERVICE DEFINITIONS FOR TARGET CLOUD EC2 NODE
###############################################################################

define host {
    use                     linux-server
    host_name               devops-ec2-node
    alias                   AWS EC2 Cloud Application Server
    address                 127.0.0.1
    check_command           check_host_ping
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# 1. HTTP Web Application Health Check (Port 80)
define service {
    use                     generic-service
    host_name               devops-ec2-node
    service_description     HTTP Web Service
    check_command           check_http_service!80!/healthz
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    notification_options    w,u,c,r
}

# 2. SSH Daemon Health Check (Port 22)
define service {
    use                     generic-service
    host_name               devops-ec2-node
    service_description     SSH Port Availability
    check_command           check_ssh_service
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notification_options    w,c,r
}

# 3. CPU Load Monitoring via NRPE
define service {
    use                     generic-service
    host_name               devops-ec2-node
    service_description     CPU Utilization
    check_command           check_remote_load
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    notification_options    w,c,r
}

# 4. Root Disk Space Utilization via NRPE
define service {
    use                     generic-service
    host_name               devops-ec2-node
    service_description     Disk Space Usage (/)
    check_command           check_remote_disk
    max_check_attempts      3
    check_interval          5
    retry_interval          2
    notification_options    w,c,r
}

# 5. Memory Utilization via NRPE
define service {
    use                     generic-service
    host_name               devops-ec2-node
    service_description     RAM Memory Utilization
    check_command           check_remote_mem
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notification_options    w,c,r
}
