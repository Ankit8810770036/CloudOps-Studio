###############################################################################
# NAGIOS COMMAND DEFINITIONS FOR DEVOPS CLOUD PLATFORM
###############################################################################

define command {
    command_name    check_http_service
    command_line    $USER1$/check_http -I $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -t 10
}

define command {
    command_name    check_ssh_service
    command_line    $USER1$/check_ssh -H $HOSTADDRESS$ -p 22 -t 10
}

define command {
    command_name    check_host_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}

define command {
    command_name    check_remote_load
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c check_load
}

define command {
    command_name    check_remote_disk
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c check_disk
}

define command {
    command_name    check_remote_mem
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c check_mem
}
