---
- name: Install Python, pip, and virtualenv
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - build-essential
    state: present

- name: Create Backend Application Directory
  file:
    path: /opt/devops_backend
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Create Python Virtual Environment
  command: python3 -m venv /opt/devops_backend/venv
  args:
    creates: /opt/devops_backend/venv/bin/activate

- name: Install FastAPI, Uvicorn, psycopg2/mysql dependencies
  pip:
    name:
      - fastapi
      - uvicorn[standard]
      - pydantic
      - requests
    virtualenv: /opt/devops_backend/venv

- name: Check if custom user-uploaded Python backend code exists
  delegate_to: localhost
  stat:
    path: "{{ role_path }}/files/app"
  register: custom_python_dir

- name: Deploy Custom Python Backend Project Files
  copy:
    src: "app/"
    dest: /opt/devops_backend/
    owner: www-data
    group: www-data
    mode: '0755'
  when: custom_python_dir.stat.exists and custom_python_dir.stat.isdir

- name: Install custom Python requirements.txt if present
  pip:
    requirements: /opt/devops_backend/requirements.txt
    virtualenv: /opt/devops_backend/venv
  when: custom_python_dir.stat.exists
  ignore_errors: yes

- name: Deploy fallback Python Backend Application Code
  template:
    src: api_app.py.j2
    dest: /opt/devops_backend/app.py
    owner: www-data
    group: www-data
    mode: '0644'
  when: not (custom_python_dir.stat.exists and custom_python_dir.stat.isdir)

- name: Configure Systemd Service for Python Backend
  template:
    src: devops-backend.service.j2
    dest: /etc/systemd/system/devops-backend.service
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd daemon and enable Python Backend service
  systemd:
    name: devops-backend
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Wait for Python Backend API to respond on port {{ backend_port | default(8000) }}
  uri:
    url: "http://127.0.0.1:{{ backend_port | default(8000) }}/api/health"
    status_code: 200
  register: py_check
  retries: 5
  delay: 2
  until: py_check.status == 200

