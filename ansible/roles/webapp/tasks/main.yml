---
- name: Ensure target directory exists
  file:
    path: "{{ web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy Web Application Static Assets
  copy:
    src: "app/"
    dest: "{{ web_root }}/"
    owner: www-data
    group: www-data
    mode: '0644'

- name: Generate Dynamic Host Metadata JSON
  copy:
    content: |
      {
        "status": "UP",
        "hostname": "{{ ansible_hostname | default('ec2-cloud-node') }}",
        "web_server": "{{ web_server_type }}",
        "os": "{{ ansible_distribution | default('Ubuntu') }} {{ ansible_distribution_version | default('22.04') }}",
        "kernel": "{{ ansible_kernel | default('Linux') }}",
        "deployed_at": "{{ ansible_date_time.iso8601 | default('2026-10-31T00:00:00Z') }}",
        "managed_by": "Ansible & Puppet",
        "monitored_by": "Nagios Core"
      }
    dest: "{{ web_root }}/healthz.json"
    owner: www-data
    group: www-data
    mode: '0644'

