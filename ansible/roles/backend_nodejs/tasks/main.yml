---
- name: Install Node.js and npm
  apt:
    name:
      - nodejs
      - npm
    state: present

- name: Create Node.js Backend Application Directory
  file:
    path: /opt/devops_node
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Check if custom user-uploaded Node.js code exists
  delegate_to: localhost
  stat:
    path: "{{ role_path }}/files/app"
  register: custom_node_dir

- name: Deploy Custom User-Uploaded Node.js Code
  copy:
    src: "app/"
    dest: /opt/devops_node/
    owner: www-data
    group: www-data
    mode: '0755'
  when: custom_node_dir.stat.exists and custom_node_dir.stat.isdir

- name: Deploy fallback package.json if not present
  copy:
    content: |
      {
        "name": "devops-node-backend",
        "version": "1.0.0",
        "main": "server.js",
        "dependencies": {}
      }
    dest: /opt/devops_node/package.json
    owner: www-data
    force: no

- name: Deploy fallback Express/Node.js Server Code
  template:
    src: server.js.j2
    dest: /opt/devops_node/server.js
    owner: www-data
    group: www-data
    mode: '0644'
  when: not (custom_node_dir.stat.exists and custom_node_dir.stat.isdir)

- name: Run npm install if package.json exists
  command: npm install --production
  args:
    chdir: /opt/devops_node
  ignore_errors: yes

- name: Configure Systemd Service for Node.js
  template:
    src: devops-node.service.j2
    dest: /etc/systemd/system/devops-node.service
    owner: root
    group: root
    mode: '0644'

- name: Enable and Start Node.js Systemd Service
  systemd:
    name: devops-node
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Verify Node.js Health Endpoint
  uri:
    url: "http://127.0.0.1:{{ backend_port | default(5000) }}/api/health"
    status_code: 200
  register: node_check
  retries: 5
  delay: 2
  until: node_check.status == 200

