---
- name: Install PostgreSQL server and client
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: Ensure PostgreSQL service is started and enabled
  service:
    name: postgresql
    state: started
    enabled: yes

- name: Create Application Database User
  become_user: postgres
  postgresql_user:
    name: "{{ db_user | default('app_user') }}"
    password: "{{ db_password | default('secure_devops_pass') }}"
    encrypted: yes
  ignore_errors: yes

- name: Create Application Database
  become_user: postgres
  postgresql_db:
    name: "{{ db_name | default('devops_db') }}"
    owner: "{{ db_user | default('app_user') }}"
  ignore_errors: yes

- name: Verify PostgreSQL responds to local socket
  command: pg_isready -h 127.0.0.1 -p 5432
  register: pg_ready
  changed_when: false

