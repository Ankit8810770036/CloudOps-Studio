---
- name: Configure Cloud Server and Deploy Full-Stack Polyglot Application
  hosts: webservers
  become: yes
  vars:
    web_server_type: "{{ web_server_type | default('nginx') }}"
    frontend_type: "{{ frontend_type | default('react') }}"
    backend_type: "{{ backend_type | default('python') }}"
    database_type: "{{ database_type | default('sqlite') }}"
    backend_port: "{{ backend_port | default(8000) }}"
    web_root: "/var/www/devops_app"

  pre_tasks:
    - name: Update apt repository cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install baseline system dependencies
      apt:
        name:
          - curl
          - wget
          - ufw
          - htop
          - git
          - net-tools
        state: present

  roles:
    # 1. Database Tier
    - role: database_postgresql
      when: database_type == 'postgresql'
    - role: database_mysql
      when: database_type == 'mysql'

    # 2. Backend Tier
    - role: backend_python
      when: backend_type == 'python'
    - role: backend_java
      when: backend_type == 'java_springboot'
    - role: backend_nodejs
      when: backend_type == 'nodejs'

    # 3. Frontend Tier & Reverse Proxy
    - role: nginx
      when: web_server_type == 'nginx'
    - role: apache
      when: web_server_type == 'apache'
    - role: webapp
    - role: nginx_reverse_proxy
      when: web_server_type == 'nginx' and backend_type != 'none'

  post_tasks:
    - name: Ensure UFW firewall allows HTTP traffic
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Ensure UFW firewall allows SSH traffic
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Verify Frontend Web Service is running and responding
      uri:
        url: "http://127.0.0.1:80"
        status_code: 200
        timeout: 10
      register: web_check
      retries: 5
      delay: 3
      until: web_check.status == 200

    - name: Display Full-Stack Deployment Summary
      debug:
        msg: "Success! Deployed Full-Stack [Frontend: {{ frontend_type }} | Backend: {{ backend_type }} (Port {{ backend_port }}) | Database: {{ database_type }}] on port 80."
